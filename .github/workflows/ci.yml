name: ci

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run check

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: zend-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure core
        run: cmake -S core -B build/core -A x64

      - name: Build core
        run: cmake --build build/core --config Release

      - name: Import audit
        run: pwsh tools/import-audit.ps1

      - name: Configure loader
        run: cmake -S loader -B build/loader -A x64

      - name: Build loader
        run: cmake --build build/loader --config Release

      - name: Configure tests
        run: cmake -S tests -B build/tests -A x64

      - name: Build tests
        run: cmake --build build/tests --config Release

      - name: Fail-open test
        run: pwsh tests/fail-open.ps1

      - name: Core smoke
        run: pwsh tests/core-smoke.ps1

      - name: Verify artifacts
        shell: pwsh
        run: |
          $core = "build/core/Release/module.dll"
          $loader = "build/loader/Release/RobloxPlayerBeta.dll"
          if (!(Test-Path $core)) { throw "missing $core" }
          if (!(Test-Path $loader)) { throw "missing $loader" }
